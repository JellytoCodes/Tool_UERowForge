name: 오류 보고
description: 재현 절차와 환경을 포함한 버그
title: "[Bug] "
body:
  - type: input
    id: version
    attributes:
      label: 앱 버전 / 커밋
      placeholder: v0.2.2 또는 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: OS, Python/EXE 여부, UE 버전(관련된 경우), 대상 모듈 유형
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 재현 절차
      description: 실사용 데이터 대신 최소 샘플을 사용하세요. 토큰/개인 경로/기밀 데이터는 제거하세요.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 기대한 결과와 실제 결과
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 로그 / 오류 / 변경점
      description: 생성 전후 diff, 최소 엑셀, 오류 화면 등. 실패 후 파일을 수기로 덮어쓰지 마세요.
  - type: checkboxes
    id: checklist
    attributes:
      label: 확인 사항
      options:
        - label: README와 현재 미지원 범위를 확인했습니다.
        - label: 문제 발생 전후의 생성 파일과 manifest를 보존했습니다.
