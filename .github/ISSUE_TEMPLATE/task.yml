name: 기능·설계 작업
description: 요구사항과 완료 조건이 명확한 작업
title: "[TD-XXX] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 현재 문제
      description: 현재 코드의 동작과 원하는 동작을 구분하세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 변경 범위 / 하지 않을 것
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: "- [ ] 입력/출력과 실패 동작을 검증한다."
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 영향 / 이관 / 관련 결정
      description: C++ 빌드, 기존 BP 호출, 파일 해시, manifest, 설정/에셋, D-ID 영향
  - type: textarea
    id: validation
    attributes:
      label: 검증 계획
      description: Python 테스트, GUI, Windows, Unreal을 구분하세요.
